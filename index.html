<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SingaDev — Contact</title>
    <meta
      name="description"
      content="Get in touch with SingaDev, Singapore's developer meetup community — Meetup, email, LinkedIn, and Telegram."
    />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script>
      // Set theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem("singadev-theme");
          var theme =
            stored ||
            (window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (err) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <button
      id="theme-toggle"
      class="theme-toggle"
      type="button"
      aria-pressed="false"
      aria-label="Switch to light theme"
    >
      <svg
        class="icon-sun"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="4" />
        <path
          d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"
        />
      </svg>
      <svg
        class="icon-moon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z" />
      </svg>
    </button>

    <main class="terminal">
      <div class="terminal-titlebar">
        <span class="dot dot-red" aria-hidden="true"></span>
        <span class="dot dot-yellow" aria-hidden="true"></span>
        <span class="dot dot-green" aria-hidden="true"></span>
        <span class="terminal-titlebar-label">singadev@meetup:~</span>
      </div>

      <div class="terminal-body">
        <p class="prompt-line">
          <span class="prompt">&gt;</span><span>whoami</span>
        </p>
        <h1 class="wordmark">
          <span class="logo-plate">
            <img src="assets/logo.png" alt="SingaDev" />
          </span>
        </h1>
        <p class="tagline">
          Singapore's community of developers who build, ship, and meet up.
          <span class="cursor">|</span>
        </p>

        <p class="output-line">
          <span class="prompt">&gt;</span> cat contacts.txt
        </p>

        <ul class="contact-list">
          <li>
            <a
              class="contact-link"
              href="https://www.meetup.com/singadev/"
              target="_blank"
              rel="noopener noreferrer"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <rect x="3" y="4" width="18" height="17" rx="2" />
                <path d="M3 9h18M8 2v4M16 2v4" />
                <circle cx="9" cy="14" r="1.5" fill="currentColor" stroke="none" />
                <circle cx="15" cy="14" r="1.5" fill="currentColor" stroke="none" />
              </svg>
              <span class="contact-text">
                <span class="contact-label">Meetup</span>
                <span class="contact-value">meetup.com/singadev</span>
              </span>
              <svg
                class="arrow"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                width="16"
                height="16"
                aria-hidden="true"
              >
                <path d="M7 17 17 7M8 7h9v9" />
              </svg>
            </a>
          </li>

          <li>
            <a class="contact-link" href="mailto:singadev@googlegroups.com">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <rect x="3" y="5" width="18" height="14" rx="2" />
                <path d="m4 7 8 6 8-6" />
              </svg>
              <span class="contact-text">
                <span class="contact-label">Email</span>
                <span class="contact-value">singadev@googlegroups.com</span>
              </span>
              <svg
                class="arrow"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                width="16"
                height="16"
                aria-hidden="true"
              >
                <path d="M7 17 17 7M8 7h9v9" />
              </svg>
            </a>
          </li>

          <li>
            <a
              class="contact-link"
              href="https://www.linkedin.com/company/singadev/"
              target="_blank"
              rel="noopener noreferrer"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <rect x="3" y="3" width="18" height="18" rx="3" />
                <path
                  d="M8 11v5M8 8v.01M12 16v-3.5a1.75 1.75 0 0 1 3.5 0V16M12 12.5V16"
                />
              </svg>
              <span class="contact-text">
                <span class="contact-label">LinkedIn</span>
                <span class="contact-value">linkedin.com/company/singadev</span>
              </span>
              <svg
                class="arrow"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                width="16"
                height="16"
                aria-hidden="true"
              >
                <path d="M7 17 17 7M8 7h9v9" />
              </svg>
            </a>
          </li>

          <li>
            <a
              class="contact-link"
              href="https://t.me/singadev"
              target="_blank"
              rel="noopener noreferrer"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path
                  d="m21 3-18.5 7.6c-.7.3-.7 1.3.1 1.5l4.6 1.4 1.7 5.6c.2.7 1.1.9 1.6.3l2.5-2.8 4.7 3.5c.6.5 1.5.1 1.6-.6L21 3Z"
                />
                <path d="M8.2 13.5 18 7" />
              </svg>
              <span class="contact-text">
                <span class="contact-label">Telegram</span>
                <span class="contact-value">@singadev</span>
              </span>
              <svg
                class="arrow"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                width="16"
                height="16"
                aria-hidden="true"
              >
                <path d="M7 17 17 7M8 7h9v9" />
              </svg>
            </a>
          </li>
        </ul>

        <p class="footer-line">
          <span class="prompt">&gt;</span>
          <span>see you at the next meetup_</span>
        </p>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
